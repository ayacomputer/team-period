name: team_period
description: Shared couple's period tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Persistence
  shared_preferences: ^2.3.2

  # Firebase — enable with: flutter run --dart-define-from-file=firebase.env.json
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1

  # Icons
  font_awesome_flutter: ^10.7.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  collection: ^1.18.0

  # Local notifications (partner reminders)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
